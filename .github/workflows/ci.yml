name: Continuous Integration

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['**']
    tags: [v*]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build and Test
    strategy:
      matrix:
        os: [ubuntu-latest]
        scala: [all]
        java: [temurin@17]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Check that workflows are up to date
        run: sbt githubWorkflowCheck

      - name: Build project and docs
        run: sbt 'test; docs/docusaurusCreateSite'

      - name: Compile sbt 2 plugin with fatal warnings
        run: sbt '++3.8.4; sbtPlugin / Compile / compile'

  publish:
    name: Publish Artifacts
    needs: [build, native]
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v'))
    strategy:
      matrix:
        os: [ubuntu-latest]
        scala: [2.13.18]
        java: [temurin@17]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Download native executables
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: dist
          merge-multiple: true

      - name: Validate native executables
        run: |
          test "$(find dist -maxdepth 1 -type f ! -name '*.sha256' | wc -l)" -eq 3
          test "$(find dist -maxdepth 1 -type f -name '*.sha256' | wc -l)" -eq 3
          for checksum in dist/*.sha256; do (cd dist && sha256sum -c "$(basename "$checksum")"); done

      - name: Publish artifacts
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        run: sbt ci-release

      - name: Attach native executables to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

      - name: Publish docs
        env:
          GIT_USER_NAME: github-actions[bot]
          CURRENT_BRANCH: ${{ github.ref_name }}
          GIT_USER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_PASS: ${{ secrets.GITHUB_TOKEN }}
          GIT_USER: github-actions[bot]
        run: sbt docs/docusaurusPublishGhpages

  native:
    name: Build Native Executables
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        scala: [3]
        java: [temurin@17]
        include:
          - os: ubuntu-24.04
            asset: difflicious-linux-x86_64
          - os: ubuntu-24.04-arm
            asset: difflicious-linux-aarch64
          - os: macos-15
            asset: difflicious-macos-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Install GraalVM
        run: mise install java@graalvm-community-25.0.1

      - name: Build and test native image
        run: mise exec java@graalvm-community-25.0.1 -- sbt --client "cli3/test ; cli3/GraalVMNativeImage/packageBin"

      - name: Verify and stage native image
        run: |
          set -euo pipefail
          binary="modules/cli/target/jvm-3/graalvm-native-image/difflicious"
          test -x "$binary"
          "$binary" --help >/dev/null
          mkdir -p dist
          cp "$binary" "dist/${{ matrix.asset }}"
          chmod 755 "dist/${{ matrix.asset }}"
          (cd dist && shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")

      - name: Upload native image
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
